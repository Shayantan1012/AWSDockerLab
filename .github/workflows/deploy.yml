name: AWS EC2 CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: college-web-deployment
  cancel-in-progress: false

jobs:
  build-test-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, ec2-lab]
    timeout-minutes: 15
    steps:
      - name: Get project files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check shell scripts
        run: |
          bash -n setup.sh
          bash -n deploy.sh

      - name: CI - Build and test website
        shell: bash
        run: |
          set -euo pipefail
          trap 'sudo env WEB_PORT=8081 BIND_ADDRESS=127.0.0.1 docker compose -p college-lab-ci down -v' EXIT
          sudo env WEB_PORT=8081 BIND_ADDRESS=127.0.0.1 docker compose -p college-lab-ci up -d --build --wait
          sudo docker compose -p college-lab-ci exec -T backend python -m unittest -v test_app
          curl --fail --silent --show-error http://127.0.0.1:8081/ | grep -q 'AWS EC2 Docker Lab'
          curl --fail --silent --show-error http://127.0.0.1:8081/api/health | grep -q 'connected'

      - name: CD - Deploy website on EC2
        run: bash deploy.sh
