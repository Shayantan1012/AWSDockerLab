name: college-lab
services:
  backend:
    build: ./backend
    volumes:
      - registrations:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  frontend:
    build: .
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/health]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  registrations:
